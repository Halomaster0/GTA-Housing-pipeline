# See docs/decisions/0001-tooling-and-ci.md for why gitleaks (not detect-secrets)
# and why ruff (not black+flake8+isort).

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6 # pinned to the same version as the `ruff` dev dependency in pyproject.toml
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Secret scanning -- hard requirement of docs/build-plan.md §0.1 and risk R9.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Conventional Commits enforcement, commit-msg stage only.
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.26.0
    hooks:
      - id: commitlint
        stages: ["commit-msg"]
        additional_dependencies:
          - "@commitlint/config-conventional@21.2.2"
