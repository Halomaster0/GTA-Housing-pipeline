    layer_url: "https://services6.arcgis.com/hM5ymMLbxIyWTjn2/arcgis/rest/services/MississaugaWards/FeatureServer/0"
    business_key: [OBJECTID]
    key_policy: unique
    facts_feed: false
    geometry: true

  # --- Brampton: production MapServer permits + planning FeatureServer ---
