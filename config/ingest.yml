  # --- Statistics Canada: metadata first, series when proven ---
  - id: statcan-building-permits-34100292
    family: statcan-meta
    product_id: 34100292
    business_key: []
    key_policy: observe
    facts_feed: false
    # series: [] — getDataFromCubePidCoordAndLatestNPeriods returned HTTP 406
