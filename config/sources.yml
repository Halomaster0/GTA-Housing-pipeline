  # ---------------------------------------------------------------------------------------
  # 3. City of Brampton — production MapServer (https://maps1.brampton.ca) plus
  #    planning FeatureServer (org https://services3.arcgis.com/rl7ACuZkiFsmDA2g)
  # Licence (all): CC BY (ArcGIS Online items, owner BramptonMaps, City of Brampton).
  #
  # _DEV RESOLUTION (decided 2026-09-10, live evidence in
  # docs/sources/evidence/2026-09-10-local-verification.md): the ONLY permits
  # service on the ArcGIS org is Building_Permits_DEV/0 (141,886 rows, max
  # ISSUEDATE 2018-10-17 — a frozen 2018-era extract). The authoritative public
  # feed is the production MapServer Building_Permits/0 (222,263 rows, INDATE up
  # to 2026-09-10, i.e. current). The AGOL "Building Permits" item (owner
  # BramptonMaps, licence CC BY) points at the production MapServer, and nothing
  # authoritative points at _DEV. Brampton's Hub sites are literally named
  # "GeoHub DEV"/"GeoHub UAT" — the suffix is their staging-environment
  # convention leaking into public names. RULE: ingest production MapServer/0;
  # no layer whose name ends _DEV/_UAT is ingested without written justification.
  # ---------------------------------------------------------------------------------------
  - id: brampton-building-permits
    name: "Brampton — Building Permits (production MapServer)"
    municipality: Brampton
    api_type: ArcGIS REST
    check_url: "https://maps1.brampton.ca/arcgis/rest/services/BuildingPermit/Building_Permits/MapServer/0/query?where=1%3D1&returnCountOnly=true&f=json"
    count_json_path: count
    observed_rows: 222263
    expected_min_rows: 177000
    expected_min_rows_calibrated: true
    licence: "CC BY (ArcGIS Online item, owner BramptonMaps, City of Brampton)"
    licence_url: null
    cadence: "UNVERIFIED — INDATE observed up to 2026-09-10 on 2026-09-10 (current)"
    verified_on: "2026-09-10"
    status: verified-live
    notes: >
      Layer 0 "Building Permits". Fields include PERMITNUMBER, ADDRESS, STATUSDESC,
      ISSUEDATE, INDATE, DWELLINGS (unit count), GFA, BUILDER, CONTRACTOR.
      ISSUEDATE is nullable (unissued permits) — schema must keep date_issued
      nullable. Layer 1 "Building Permits Activity" (2,494,357 rows) is the
      per-activity log, not the permit grain — not registered as a fact feed.
      NEVER ingest Building_Permits_DEV (frozen 2018-10-17, 141,886 rows).

