    expected_min_rows: 500
    expected_min_rows_calibrated: true
    licence: "Open Data Licence for The Regional Municipality of Peel, Version 1.0"
    licence_url: "https://data.peelregion.ca/pages/license"
    cadence: "UNVERIFIED"
