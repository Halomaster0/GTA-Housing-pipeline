  # 4. Region of Peel — ArcGIS (org https://services6.arcgis.com/ONZht79c8QWuX759)
  # Licence (all): "Open Data Licence for The Regional Municipality of Peel,
  #   Version 1.0" — worldwide, royalty-free, perpetual, non-exclusive; commercial
