# Source registry — drives scripts/verify_sources.py.
#
# STATUS AS OF 2026-09-10: every entry below marked `verified-live` was confirmed
# with a live HTTP call returning rows, from two independent environments:
#   (a) a GitHub Actions runner (see docs/sources/evidence/2026-09-10-runner-discovery.md,
#       199 facts from live responses), and
#   (b) a network-enabled local session on 2026-09-10, which re-verified every
#       load-bearing count and resolved the two blocking questions (Toronto licence,
#       Brampton _DEV). Raw transcript:
#       docs/sources/evidence/2026-09-10-local-verification.md
#
# `expected_min_rows` is a conservative fraction (~75-80%, rounded down) of the
# observed count, per the calibration rule. `expected_min_rows_calibrated: true`
# means the threshold derives from a real observation recorded in `observed_rows`.
#
# Licence rule: the exact licence name is recorded per source. Where the API and
# the portal disagree (Toronto CKAN returns "License not specified" while every
# dataset page names the portal licence), BOTH are recorded and the portal-page
# licence governs, with the discrepancy noted.

sources:
