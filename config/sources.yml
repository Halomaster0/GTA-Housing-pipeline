  # Peel is a geography/demographics source, NOT a permit source: its
  # Building_Permits layer holds 684 rows for a region of ~1.5M people (not a
  # permit register). Caledon appears in the municipal boundary but has no
  # discovered permit feed — out-of-scope-or-surfaced-gap decision is Phase 2.
  # PII note: Ward_Boundary_2018_2022 carries councillor FirstName/Phone/email
  #   columns — dropped at bronze->silver like Toronto CONTACT_*.
  # ---------------------------------------------------------------------------------------
  - id: peel-building-permits
