  # ---------------------------------------------------------------------------------------
  # 5. Statistics Canada
  # ---------------------------------------------------------------------------------------
  - id: statcan-wds-liveness
    name: "Statistics Canada — Web Data Service liveness (full cube list)"
    municipality: Region-wide (StatCan)
    api_type: SDMX/REST (WDS, JSON)
    check_url: "https://www150.statcan.gc.ca/t1/wds/rest/getAllCubesListLite"
    count_json_path: "$__array_length__"
    expected_min_rows: 0
    expected_min_rows_calibrated: false
    licence: "UNVERIFIED — prior general knowledge only: StatCan data is published under the 'Statistics Canada Open Licence'. Not confirmed live this session."
    licence_url: "https://www.statcan.gc.ca/en/reference/licence"
    cadence: "UNVERIFIED"
    verified_on: null
    status: unverified-blocked
    notes: >
      getAllCubesListLite (GET) lists every StatCan data table, so a successful call proves
      WDS is reachable but is not itself the census/permits/starts data we need.
      count_json_path "$__array_length__" is a verify_sources.py convention meaning "the
      whole response body is a JSON array; count = its length" (see script). Real product
      IDs for (a) 2021 Census Profile population by census subdivision/tract, and
      (b) the building permits / housing starts & completions series, must be obtained via
      a live getCubeMetadata (POST) call and recorded as their own registry entries — none
      are guessed here per the CEO's rule against trusting remembered product IDs.

