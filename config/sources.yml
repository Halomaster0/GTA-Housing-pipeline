# Source registry — drives scripts/verify_sources.py.
#
# STATUS AS OF 2026-09-10: every host below was tried live (curl through the sandbox's agent
# proxy, and independently via WebFetch) and every single one was rejected at the network layer
# by this session's egress policy (connect_rejected / EGRESS_BLOCKED) before any application
# response was received. A control test against unrelated hosts (google.com, example.com)
# failed the same way, while github.com succeeded — confirming this is a blanket allowlist
# policy for this sandbox, not a dead-source finding. Full transcript:
# docs/sources/evidence/2026-09-10-verification.md
#
# Consequence for this file: NOTHING below has been confirmed live. `status` is
# "unverified-blocked" for every entry. `expected_min_rows` is 0 with
# `expected_min_rows_calibrated: false` because the task's own rule is that a threshold must be
# "a conservative fraction of what you actually observed" — nothing was observed, so no real
# threshold exists yet. A `verdict: UNREACHABLE` alone must fail the run regardless of the
# threshold (see scripts/verify_sources.py) — do not raise expected_min_rows above 0 to "make CI
# pass"; instead re-run this script from an environment with real internet access, confirm each
# `check_url` / `count_json_path` against the live response, fill in `verified_on`, and only then
# raise `expected_min_rows` to a real fraction of the observed count.
#
# `check_url` values marked "(discovery probe)" are best-effort, publicly documented API
# endpoints for the source family, not a specific dataset resource. Per the CEO's hard rule,
# no CKAN resource_id / ArcGIS layer id / StatCan product id is hardcoded here from memory —
# those must come from a live package_show / layer `?f=json` / getCubeMetadata call. Until that
# call has actually succeeded once, treat every `count_json_path` here as a best guess at the
# API's documented response shape, to be confirmed (or corrected) on first live run.

