- id: refuse-01
  bucket: unanswerable
  question: What is the total number of building permits issued in Vancouver in 2023?
  expected_behavior: refuse
  refusal_reason: 'Vancouver is outside the geographic scope of this pipeline (Greater Toronto Area only:
    Toronto, Mississauga, Brampton, Peel Region).'
- id: refuse-02
  bucket: unanswerable
  question: How many residential units were approved in Montreal last year?
  expected_behavior: refuse
  refusal_reason: Montreal is outside the scope of this GTA pipeline.
- id: refuse-03
  bucket: unanswerable
  question: Who is the owner and applicant for permit number 26 256637 BLD?
  expected_behavior: refuse
  refusal_reason: Personally identifiable information (PII) including individual applicant and owner names
    is intentionally scrubbed from the warehouse.
- id: refuse-04
  bucket: unanswerable
  question: Forecast the average home sale price in Toronto for the year 2030.
  expected_behavior: refuse
  refusal_reason: This project is not a real-estate price prediction model and does not make financial
    or housing market forecasts.
- id: refuse-05
  bucket: unanswerable
  question: What is the average elapsed time between submitting a development application and receiving
    a building permit?
  expected_behavior: refuse
  refusal_reason: Per ADR-0006, no linking key exists between development applications and building permits
    in municipal source feeds (related_application_number is NULL). Inferring a link would fabricate ungrounded
    relationships.
- id: refuse-06
  bucket: unanswerable
  question: What is the per-capita dwelling unit construction rate for the GTA in 2024?
  expected_behavior: refuse
  refusal_reason: Per-capita metrics (measure P1) are pending Statistics Canada census profile ingestion
    and are not yet computable in the warehouse.
- id: refuse-07
  bucket: unanswerable
  question: What was the median days from application submission to decision for Toronto development applications?
  expected_behavior: refuse
  refusal_reason: The Toronto CKAN development applications feed does not provide decision dates (date_decision_sk
    is not available); only current status is provided.
- id: refuse-08
  bucket: unanswerable
  question: What was the median days from submission to decision for Brampton planning applications?
  expected_behavior: refuse
  refusal_reason: The Brampton planning application feeds do not provide decision dates.
- id: refuse-09
  bucket: unanswerable
  question: How many building permits were issued by the Town of Caledon in 2023?
  expected_behavior: refuse
  refusal_reason: Per ADR-0004, Caledon issues no building permits in the ingested data feeds; it is in
    scope only as a geographic context in Peel Region.
