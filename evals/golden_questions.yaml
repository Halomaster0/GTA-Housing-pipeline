questions:
- id: agg-01
  bucket: simple_aggregate
  question: What is the total number of permits issued across the GTA in the warehouse?
  expected_behavior: answer
  expected_sql: SELECT count(*) AS total_issued FROM gold.fct_permits WHERE date_issued_sk IS NOT NULL;
  expected_facts:
  - '647589'
- id: agg-02
  bucket: simple_aggregate
  question: How many total permit records exist for Toronto in the warehouse?
  expected_behavior: answer
  expected_sql: SELECT count(*) FROM gold.fct_permits p JOIN gold.dim_municipality m ON p.municipality_sk
    = m.municipality_sk WHERE m.municipality_code = 'TOR';
  expected_facts:
  - '571986'
