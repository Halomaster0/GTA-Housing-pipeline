- id: comp-01
  bucket: comparative
  question: 'Which municipality has issued more permits: Toronto or Brampton?'
  expected_behavior: answer
  expected_sql: SELECT m.municipality_name, count(*) AS issued FROM gold.fct_permits p JOIN gold.dim_municipality
    m ON p.municipality_sk = m.municipality_sk WHERE p.date_issued_sk IS NOT NULL AND m.municipality_code
    IN ('TOR', 'BRAM') GROUP BY m.municipality_name ORDER BY issued DESC;
  expected_facts:
  - Toronto
  - Brampton
  - '462039'
  - '150936'
- id: comp-02
  bucket: comparative
  question: Compare the number of still-open development applications between Mississauga and Brampton.
  expected_behavior: answer
  expected_sql: SELECT m.municipality_name, count(*) AS open_applications FROM gold.fct_applications a
    JOIN gold.dim_municipality m ON a.municipality_sk = m.municipality_sk JOIN gold.dim_status s ON a.status_sk
    = s.status_sk WHERE s.applies_to = 'application' AND s.is_terminal = FALSE AND m.municipality_code
    IN ('MISS', 'BRAM') GROUP BY m.municipality_name ORDER BY m.municipality_name;
  expected_facts:
  - Brampton
  - Mississauga
- id: comp-03
  bucket: comparative
  question: Which municipality has the greatest total number of development applications in the warehouse?
  expected_behavior: answer
  expected_sql: SELECT m.municipality_name, count(*) as cnt FROM gold.fct_applications a JOIN gold.dim_municipality
    m ON a.municipality_sk = m.municipality_sk GROUP BY m.municipality_name ORDER BY cnt DESC LIMIT 1;
  expected_facts:
  - Brampton
  - '11630'
- id: comp-04
  bucket: comparative
  question: Compare the total construction value between Toronto and Mississauga.
  expected_behavior: answer
  expected_sql: SELECT m.municipality_name, sum(p.construction_value_cad) FROM gold.fct_permits p JOIN
    gold.dim_municipality m ON p.municipality_sk = m.municipality_sk WHERE m.municipality_code IN ('TOR',
    'MISS') GROUP BY m.municipality_name;
  expected_facts:
  - Toronto
  - Mississauga
  - '18269933097'
  - '100991303902.29'
- id: comp-05
  bucket: comparative
  question: Which municipality has the fastest median permit turnaround from application to issuance?
  expected_behavior: answer
  expected_sql: SELECT m.municipality_name, median(d_i.calendar_date - d_a.calendar_date) as median_days
    FROM gold.fct_permits p JOIN gold.dim_municipality m ON p.municipality_sk = m.municipality_sk JOIN
    gold.dim_date d_a ON p.date_applied_sk = d_a.date_sk JOIN gold.dim_date d_i ON p.date_issued_sk =
    d_i.date_sk GROUP BY m.municipality_name ORDER BY median_days ASC;
  expected_facts:
  - Toronto
  - '28'
- id: comp-06
  bucket: comparative
  question: Compare the median permit applied-to-issued days between Toronto, Mississauga, and Brampton.
  expected_behavior: answer
  expected_sql: SELECT m.municipality_name, median(d_i.calendar_date - d_a.calendar_date) as median_days
    FROM gold.fct_permits p JOIN gold.dim_municipality m ON p.municipality_sk = m.municipality_sk JOIN
    gold.dim_date d_a ON p.date_applied_sk = d_a.date_sk JOIN gold.dim_date d_i ON p.date_issued_sk =
    d_i.date_sk GROUP BY m.municipality_name ORDER BY median_days ASC;
  expected_facts:
  - '28'
  - '34'
  - '44'
- id: comp-07
  bucket: comparative
  question: How do closed development application counts compare to under-review application counts across
    all GTA municipalities?
  expected_behavior: answer
  expected_sql: SELECT s.status_code, count(*) AS application_count FROM gold.fct_applications a JOIN
    gold.dim_status s ON a.status_sk = s.status_sk WHERE s.applies_to = 'application' AND s.status_code
    IN ('CLOSED', 'UNDER_REVIEW') GROUP BY s.status_code ORDER BY s.status_code;
  expected_facts:
  - CLOSED
  - UNDER_REVIEW
  - '10964'
  - '2178'
- id: comp-08
  bucket: comparative
  question: In Brampton, are there more residential or mixed-use permits issued?
  expected_behavior: answer
  expected_sql: SELECT u.use_type_label, count(*) AS permits_issued FROM gold.fct_permits p JOIN gold.dim_municipality
    m ON p.municipality_sk = m.municipality_sk JOIN gold.dim_use_type u ON p.use_type_sk = u.use_type_sk
    WHERE m.municipality_code = 'BRAM' AND u.use_type_code IN ('RESIDENTIAL', 'MIXED_USE') AND p.date_issued_sk
    IS NOT NULL GROUP BY u.use_type_label ORDER BY u.use_type_label;
  expected_facts:
  - Residential
  - Mixed use
- id: comp-09
  bucket: comparative
  question: Did Toronto issue more permits in 2021 or 2022?
  expected_behavior: answer
  expected_sql: SELECT d.year, count(*) FROM gold.fct_permits p JOIN gold.dim_municipality m ON p.municipality_sk
    = m.municipality_sk JOIN gold.dim_date d ON p.date_issued_sk = d.date_sk WHERE m.municipality_code
    = 'TOR' AND d.year IN (2021, 2022) GROUP BY d.year;
  expected_facts:
